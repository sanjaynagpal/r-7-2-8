---
# Replace host names / addresses with your own.
# `mesh_address` (optional, per host) = the address OTHER servers use to reach
# this host over SSH. Defaults to ansible_host, then inventory_hostname.
all:
  children:
    rhel7:            # legacy, being decommissioned - touched ONLY via `raw`
      hosts:
        rhel7-app01: { ansible_host: 10.10.7.11 }
        rhel7-app02: { ansible_host: 10.10.7.12 }
        rhel7-app03: { ansible_host: 10.10.7.13 }
        rhel7-app04: { ansible_host: 10.10.7.14 }
    rhel8:            # target platform - fully managed by Ansible
      hosts:
        rhel8-app01: { ansible_host: 10.10.8.11 }
        rhel8-app02: { ansible_host: 10.10.8.12 }
        rhel8-app03: { ansible_host: 10.10.8.13 }
        rhel8-app04: { ansible_host: 10.10.8.14 }
